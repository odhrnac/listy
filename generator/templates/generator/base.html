<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Generator{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

        nav {
            background: #2c3e50; padding: 12px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav a { color: #ecf0f1; text-decoration: none; margin-left: 20px; }
        nav a:hover { text-decoration: underline; }
        nav .brand { font-weight: bold; font-size: 18px; color: white; }

        .container {
            max-width: 700px; margin: 40px auto; padding: 30px;
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1, h2 { margin-bottom: 20px; color: #2c3e50; }

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        .btn {
            display: inline-block; margin-top: 20px; padding: 10px 25px;
            background: #2c3e50; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-size: 15px; text-decoration: none;
        }
        .btn:hover { background: #34495e; }

        .alert { padding: 12px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; font-weight: bold; }

        .status-success { color: #155724; font-weight: bold; }
        .status-error { color: #721c24; font-weight: bold; }
        .status-pending { color: #856404; font-weight: bold; }
        .status-processing { color: #856404; font-weight: bold; }

        .help-text { font-size: 12px; color: #888; margin-top: 3px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <span class="brand">PDF Generator</span>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'upload' %}">Upload</a>
                <a href="{% url 'history' %}">History</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:#ecf0f1; cursor:pointer; font-size:inherit; margin-left:20px;">Logout ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
