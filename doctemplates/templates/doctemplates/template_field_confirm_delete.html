{% extends "generator/base.html" %}
{% block title %}Delete Field{% endblock %}

{% block content %}
<h2>Remove field "{{ field.field_name }}" from "{{ template.name }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#c0392b;">Remove</button>
    <a href="{% url 'template_field_list' template.id %}" style="margin-left:15px;">Cancel</a>
</form>
{% endblock %}
